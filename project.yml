name: LittleSnitchVPNCompanion
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.7"

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.7"
    # Обе архитектуры явно, а не через ARCHS_STANDARD: приложение переносится готовым
    # бандлом на Intel-машину (Xcode 26 в App Store — только под Apple Silicon), и в день,
    # когда Apple уберёт x86_64 из «стандартных», сборка молча перестала бы там запускаться.
    ARCHS: arm64 x86_64
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    SWIFT_EMIT_LOC_STRINGS: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  LittleSnitchVPNCompanion:
    type: application
    platform: macOS
    sources:
      - App
      - Application
      - Domain
      - Infrastructure
      - path: Helper/HelperProtocol.swift
      - path: Helper/FailsafeConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion
        PRODUCT_NAME: Little Snitch VPN Companion
        PRODUCT_MODULE_NAME: LittleSnitchVPNCompanion
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Little Snitch VPN Companion
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 sunnyday.dev"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        # LaunchServices, Background Task Management и Notification Center
        # кэшируют AppIcon по identity/version бандла: при неизменившемся build
        # number системные поверхности показывают старую иконку даже после
        # переустановки. Поэтому в релизе значение приходит override-ом из
        # Scripts/release.sh — числом коммитов, которое растёт само. Здесь лежит
        # значение для локальных сборок: правя иконку в Debug, сбрасывать
        # системный кэш придётся руками.
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: "1.0"
    dependencies:
      - target: Helper
        link: false
        embed: false
    postBuildScripts:
      - name: Embed privileged helper
        # Копируем до финальной подписи таргета: бинарь демона в Contents/MacOS,
        # launchd-plist в Contents/Library/LaunchDaemons (контракт SMAppService.daemon)
        script: |
          set -euo pipefail
          APP_CONTENTS="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${APP_CONTENTS}/Library/LaunchDaemons" "${APP_CONTENTS}/MacOS"
          ditto "${BUILT_PRODUCTS_DIR}/dev.sunnyday.lsvpncompanion.helper" \
                "${APP_CONTENTS}/MacOS/dev.sunnyday.lsvpncompanion.helper"
          ditto "${SRCROOT}/Helper/dev.sunnyday.lsvpncompanion.helper.plist" \
                "${APP_CONTENTS}/Library/LaunchDaemons/dev.sunnyday.lsvpncompanion.helper.plist"
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/dev.sunnyday.lsvpncompanion.helper
          - $(SRCROOT)/Helper/dev.sunnyday.lsvpncompanion.helper.plist
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/dev.sunnyday.lsvpncompanion.helper
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/dev.sunnyday.lsvpncompanion.helper.plist
      - name: Generate complete legacy AppIcon.icns
        # Icon Composer — единственный источник иконки. Сгенерированный Xcode
        # fallback AppIcon.icns содержит лишь часть размеров. До подписи бандла
        # дорисовываем недостающие rendition-ы штатным ictool и дополняем ICNS.
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # ictool требует саму macOS 26: под macOS 15 он падает с Abort trap
          # даже при выбранном Xcode 26. Условие — «macOS 26+ либо не Release»:
          # на свежей ОС дорисовываем всегда, на старой Release падает явно,
          # а не отдаёт молча урезанный ICNS. Debug на старой ОС пропускаем —
          # иконка там роли не играет.
          MACOS_MAJOR="$(/usr/bin/sw_vers -productVersion | /usr/bin/cut -d. -f1)"
          if [ "${MACOS_MAJOR}" -lt 26 ]; then
            if [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: полный AppIcon.icns требует macOS 26+, хост — macOS ${MACOS_MAJOR}"
              exit 1
            fi
            echo "note: пропускаю полный AppIcon.icns — нужна macOS 26+, хост macOS ${MACOS_MAJOR}"
            exit 0
          fi
          RESOURCES_DIR="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          TEMP_DIR="$(mktemp -d "${DERIVED_FILE_DIR}/AppIcon.XXXXXX")"
          trap '/bin/rm -rf "${TEMP_DIR}"' EXIT
          ICONSET_DIR="${TEMP_DIR}/AppIcon.iconset"
          ICON_DOCUMENT="${SRCROOT}/App/AppIcon.icon"
          ICTOOL="${DEVELOPER_DIR}/../Applications/Icon Composer.app/Contents/Executables/ictool"
          mkdir -p "${ICONSET_DIR}"
          render() {
            OUTPUT_FILE="${ICONSET_DIR}/$1"
            "${ICTOOL}" "${ICON_DOCUMENT}" --export-image \
              --output-file "${OUTPUT_FILE}" --platform macOS \
              --rendition Default --width "$2" --height "$2" --scale "$3"
            /usr/bin/sips -m "/System/Library/ColorSync/Profiles/sRGB Profile.icc" \
              "${OUTPUT_FILE}" --out "${OUTPUT_FILE}" >/dev/null
          }
          render icon_32x32.png 32 1
          render icon_32x32@2x.png 32 2
          render icon_256x256.png 256 1
          render icon_256x256@2x.png 256 2
          render icon_512x512.png 512 1
          render icon_512x512@2x.png 512 2
          /usr/bin/python3 "${SRCROOT}/Scripts/pack_icns.py" \
            "${ICONSET_DIR}" "${RESOURCES_DIR}/AppIcon.icns" \
            "${RESOURCES_DIR}/AppIcon.icns"
        inputFiles:
          - $(SRCROOT)/App/AppIcon.icon/icon.json
          - $(SRCROOT)/App/AppIcon.icon/Assets/Foreground.png
          - $(SRCROOT)/Scripts/pack_icns.py

  Helper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
        excludes:
          - "Info.plist"
          - "*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion.helper
        PRODUCT_NAME: dev.sunnyday.lsvpncompanion.helper
        PRODUCT_MODULE_NAME: LSVPNCompanionHelper
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        # Как и у приложения — дефолт для локальных сборок, в релизе приходит
        # override-ом из Scripts/release.sh. Число то же самое: helper едет
        # внутри бандла, и разные версии у него и у приложения означали бы
        # только то, что одно из значений забыли обновить.
        CURRENT_PROJECT_VERSION: 6
        MARKETING_VERSION: "1.0"

  DomainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Domain
      - Tests/DomainTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion.domaintests
        GENERATE_INFOPLIST_FILE: YES

  ApplicationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Domain
      - Application
      # Ports.swift ссылается на FailsafeConfig — тип шарится с helper
      - path: Helper/FailsafeConfig.swift
      - Tests/ApplicationTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion.applicationtests
        GENERATE_INFOPLIST_FILE: YES

  HelperTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Helper/RuleGroupModelParser.swift
      # Failsafe-логика тестируется без XPC: типы + константы helper
      - path: Helper/HelperProtocol.swift
      - path: Helper/FailsafeConfig.swift
      - path: Helper/FailsafeStore.swift
      - path: Helper/FailsafeSupervisor.swift
      - Tests/HelperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion.helpertests
        GENERATE_INFOPLIST_FILE: YES

  InfrastructureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Domain
      - Application
      - Infrastructure
      - path: Helper/HelperProtocol.swift
      - path: Helper/FailsafeConfig.swift
      - Tests/InfrastructureTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.sunnyday.lsvpncompanion.infrastructuretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LittleSnitchVPNCompanion:
    build:
      targets:
        LittleSnitchVPNCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DomainTests
        - ApplicationTests
        - HelperTests
        - InfrastructureTests

  # Тесты без app-таргета. Компиляция App/AppIcon.icon требует рантайма
  # macOS 26: на macOS 15 actool падает с IBPlatformToolFailureException
  # («AssetCatalogAgent-AssetRuntime»), и весь билд краснеет ещё до тестов.
  # Тестовые бандлы берут исходники Domain/Application/Infrastructure/Helper
  # напрямую и ассет-каталог не трогают, поэтому нижнюю границу
  # поддерживаемого диапазона проверяем этой схемой.
  Tests:
    build:
      targets:
        DomainTests: [test]
        ApplicationTests: [test]
        HelperTests: [test]
        InfrastructureTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DomainTests
        - ApplicationTests
        - HelperTests
        - InfrastructureTests
